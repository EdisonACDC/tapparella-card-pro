<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Home Assistant — Tapparella animata</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Roboto,"Segoe UI",system-ui,sans-serif}
/* Ciclo di 9 secondi: chiusa -> apertura -> aperta -> chiusura -> chiusa */
@keyframes roll{0%,6%{height:100%}46%,54%{height:0%}94%,100%{height:100%}}
@keyframes fillh{0%,6%{height:0%}46%,54%{height:100%}94%,100%{height:0%}}
@keyframes knobv{0%,6%{bottom:-11px}46%,54%{bottom:calc(100% - 11px)}94%,100%{bottom:-11px}}
@keyframes stClosed{0%,6%{opacity:1}10%,90%{opacity:0}94%,100%{opacity:1}}
@keyframes stOpening{0%,8%{opacity:0}12%,42%{opacity:1}46%,100%{opacity:0}}
@keyframes stOpen{0%,44%{opacity:0}48%,52%{opacity:1}56%,100%{opacity:0}}
@keyframes stClosing{0%,54%{opacity:0}58%,90%{opacity:1}94%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ph{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:linear}
.sC{animation-name:stClosed}.sO{animation-name:stOpening}.sA{animation-name:stOpen}.sG{animation-name:stClosing}
.slats{animation:roll 9s ease-in-out infinite}
.fill{animation:fillh 9s ease-in-out infinite}
.knob{animation:knobv 9s ease-in-out infinite}
.dotp{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .slats,.fill,.knob,.ph,.dotp{animation:none !important}
  .sC{opacity:1}
}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#f5f5f5;display:flex;flex-direction:column;color:#1c1c1c">
  <div style="height:56px;box-sizing:border-box;background:#03a9f4;color:#fff;display:flex;align-items:center;padding:0 16px;gap:20px;box-shadow:0 2px 4px rgba(0,0,0,.2)">
    <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    <span style="font-size:20px;font-weight:500;flex:1">Soggiorno</span>
    <svg width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" d="M12 8a2 2 0 110-4 2 2 0 010 4zm0 2a2 2 0 110 4 2 2 0 010-4zm0 6a2 2 0 110 4 2 2 0 010-4z"/></svg>
  </div>

  <div style="padding:12px;display:flex;flex-direction:column;gap:12px">
    <div style="background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12)">
      <div style="background:linear-gradient(135deg,#334155,#1e293b);padding:14px 18px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Tapparella PRO</div>
          <div style="font-size:18px;font-weight:600;color:#fff">Soggiorno</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:3px;padding:6px;background:rgba(255,255,255,.1);border-radius:10px">
          <div style="width:36px;height:6px;background:#cbd5e1;border-radius:2px"></div>
          <div style="width:36px;height:5px;background:#cbd5e1;border-radius:2px"></div>
          <div style="width:36px;height:4px;background:#cbd5e1;border-radius:2px"></div>
          <div style="width:36px;height:3px;background:#cbd5e1;border-radius:2px"></div>
          <div style="width:36px;height:2px;background:#cbd5e1;border-radius:2px"></div>
          <div style="width:36px;height:2px;background:#cbd5e1;border-radius:2px"></div>
        </div>
      </div>

      <!-- finestra + barra verticale laterale -->
      <div style="padding:12px 14px 0;display:flex;gap:12px;align-items:stretch">
        <div style="position:relative;flex:1;height:180px;border-radius:10px;overflow:hidden;background:#1e293b">
          <!-- scena esterna -->
          <div style="position:absolute;left:16px;top:16px;right:16px;bottom:16px;border-radius:4px;overflow:hidden;background:linear-gradient(180deg,#60a5fa 0%,#93c5fd 60%,#bfdbfe 100%)">
            <div style="position:absolute;left:0;right:0;bottom:0;height:38px;background:linear-gradient(180deg,#4ade80,#16a34a)"></div>
            <div style="position:absolute;right:28px;top:14px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.85)"></div>
            <div style="position:absolute;right:70px;top:24px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6)"></div>
          </div>
          <!-- telaio della finestra -->
          <div style="position:absolute;left:16px;top:16px;right:16px;bottom:16px;border-radius:4px;box-shadow:inset 0 0 0 3px #64748b;pointer-events:none"></div>
          <!-- tapparella: cassonetto fisso in alto, stecche che salgono e scendono -->
          <div style="position:absolute;left:8px;right:8px;top:8px;height:164px;overflow:hidden">
            <!-- cassonetto in alloggiamento: luce dall'alto e ombra sotto -->
            <div style="position:absolute;left:-4px;right:-4px;top:0;height:12px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#e2e8f0 0%,#94a3b8 35%,#64748b 70%,#475569 100%);box-shadow:0 2px 3px rgba(0,0,0,.35)"></div>
            <div style="position:absolute;left:10px;right:10px;top:12px;height:2px;background:rgba(15,23,42,.45)"></div>
            <!-- stecche in alluminio: ogni lama ha luce, bordo e ombra -->
            <div class="slats" style="position:absolute;left:0;right:0;top:12px;height:100%;border-radius:0 0 3px 3px;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.22) 22%,rgba(255,255,255,0) 45%,rgba(0,0,0,0) 70%,rgba(0,0,0,.18) 100%),repeating-linear-gradient(180deg,#f8fafc 0px,#cbd5e1 2px,#94a3b8 9px,#64748b 13px,#334155 15px,#1e293b 16px);box-shadow:0 10px 12px -4px rgba(0,0,0,.55);box-sizing:border-box">
              <!-- maniglia di sollevamento in basso -->
              <div style="position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:44px;height:8px;border-radius:4px;background:linear-gradient(180deg,#e2e8f0,#64748b);box-shadow:0 1px 2px rgba(0,0,0,.4)"></div>
            </div>
          </div>
        </div>

        <!-- barra di posizione verticale: 100% in alto, 0% in basso -->
        <div style="width:40px;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;flex-shrink:0">
          <span style="font-size:10px;color:#94a3b8">Aperta</span>
          <div style="position:relative;flex:1;width:26px;margin:4px 0;border-radius:13px;background:#f1f5f9;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)">
            <div class="fill" style="position:absolute;left:0;right:0;bottom:0;height:0%;background:#fbbf24;border-radius:13px"></div>
            <div class="knob" style="position:absolute;left:50%;transform:translateX(-50%);bottom:-11px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);border:2px solid #cbd5e1;box-sizing:border-box"></div>
          </div>
          <span style="font-size:10px;color:#94a3b8">Chiusa</span>
        </div>
      </div>

      <div style="padding:14px 18px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="dotp" style="width:10px;height:10px;border-radius:50%;background:#34d399"></div>
            <div style="position:relative;height:20px;min-width:110px">
              <span class="ph sC" style="font-size:14px;font-weight:600;color:#94a3b8">Chiusa</span>
              <span class="ph sO" style="font-size:14px;font-weight:600;color:#34d399">In apertura…</span>
              <span class="ph sA" style="font-size:14px;font-weight:600;color:#fb923c">Aperta</span>
              <span class="ph sG" style="font-size:14px;font-weight:600;color:#34d399">In chiusura…</span>
            </div>
          </div>
          <div style="position:relative;height:40px;min-width:90px">
            <span class="ph sC" style="font-size:32px;font-weight:700;color:#1e293b">0<span style="font-size:18px;color:#94a3b8;font-weight:500">%</span></span>
            <span class="ph sO" style="font-size:32px;font-weight:700;color:#1e293b">…</span>
            <span class="ph sA" style="font-size:32px;font-weight:700;color:#1e293b">100<span style="font-size:18px;color:#94a3b8;font-weight:500">%</span></span>
            <span class="ph sG" style="font-size:32px;font-weight:700;color:#1e293b">…</span>
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <div style="flex:1;padding:8px 4px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;color:#475569;font-size:13px;font-weight:500;text-align:center">Chiudi</div>
          <div style="flex:1;padding:8px 4px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;color:#475569;font-size:13px;font-weight:500;text-align:center">Stop</div>
          <div style="flex:1;padding:8px 4px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;color:#475569;font-size:13px;font-weight:500;text-align:center">Apri</div>
        </div>
        <div style="height:1px;background:#f1f5f9"></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:36px;height:36px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 22 22" fill="none"><rect x="1" y="1" width="20" height="20" rx="2" stroke="#94a3b8" stroke-width="1.5" fill="#f1f5f9"/><line x1="11" y1="1" x2="11" y2="21" stroke="#94a3b8" stroke-width="1.2"/><line x1="1" y1="11" x2="21" y2="11" stroke="#94a3b8" stroke-width="1.2"/></svg>
          </div>
          <div>
            <div style="font-size:14px;font-weight:500;color:#334155">Finestra</div>
            <div style="font-size:12px;font-weight:600;color:#94a3b8">Chiusa</div>
          </div>
        </div>
      </div>
      <div style="background:#f8fafc;padding:10px 18px;display:flex;justify-content:space-between;border-top:1px solid #f1f5f9">
        <span style="font-size:12px;color:#94a3b8">Ultima posizione</span>
        <span style="font-size:12px;color:#94a3b8">Demo · ciclo 9 s</span>
      </div>
    </div>

    <div style="background:#fff;border-radius:16px;padding:8px 16px;box-shadow:0 2px 12px rgba(0,0,0,.08)">
      <div style="display:flex;align-items:center;gap:14px;height:52px;border-bottom:1px solid #f1f1f1">
        <div style="width:36px;height:36px;border-radius:50%;background:#fff3e0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#e65100">CU</div>
        <div style="flex:1;font-size:15px">Cucina</div>
        <div style="font-size:14px;color:#757575">Chiusa · 0%</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;height:52px">
        <div style="width:36px;height:36px;border-radius:50%;background:#e3f2fd;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1565c0">CA</div>
        <div style="flex:1;font-size:15px">Camera da letto</div>
        <div style="font-size:14px;color:#757575">Aperta · 100%</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
